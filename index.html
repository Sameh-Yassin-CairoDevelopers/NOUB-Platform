<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NOUB SPORTS - نوب سبورتس</title>
    <meta name="description" content="منصة نوب سبورتس الرياضية الأصلية: كارت اللاعب 3D، المباريات والملاعب، بطولات رمضان، السبورة التكتيكية، وإدارة الفرق" />
    <meta property="og:title" content="NOUB SPORTS - نوب سبورتس" />
    <meta property="og:description" content="منصة نوب سبورتس الرياضية الأصلية: كارت اللاعب 3D، المباريات والملاعب، بطولات رمضان، السبورة التكتيكية، وإدارة الفرق" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Changa:wght@500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Master CSS -->
    <link rel="stylesheet" href="./css/main.css">
  </head>
  <body>
    <!-- 1. شاشة البداية الأصلية السريعة (Original Splash) -->
    <div id="screen-splash">
      <div class="brand-logo">
        <h1>NOUB</h1>
        <span>SPORTS</span>
      </div>
      <div class="loading-text">جاري التحميل...</div>
    </div>

    <!-- 2. الهيدر العام الأنيق الأصلي (Original Top Header) -->
    <header id="global-header" class="app-header">
      <div class="header-controls">
        <button id="menu-toggle-btn" class="icon-btn-ghost" title="القائمة">
          <i class="fa-solid fa-bars"></i>
        </button>
        <button id="notif-btn" class="icon-btn-ghost" title="الإشعارات" style="position:relative;">
          <i class="fa-regular fa-bell"></i>
          <span class="badge-dot"></span>
        </button>
      </div>

      <div class="header-gold-pill" id="header-gold-pill" title="رصيد الذهب">
        <i class="fa-solid fa-coins" style="color:var(--gold-main);"></i>
        <span id="header-gold-val">50,000</span>
      </div>

      <div class="profile-summary" id="header-profile-trigger" title="الملف الشخصي والجواز الرياضي">
        <div class="user-texts">
          <h3 id="header-user-name">كابتن نوب</h3>
          <span>PRO PLAYER</span>
        </div>
        <div class="avatar-circle">
          <i class="fa-solid fa-user-ninja"></i>
        </div>
      </div>
    </header>

    <!-- 3. المحتوى الرئيسي لجميع أقسام المنصة الأصلية (Main Application Views) -->
    <main id="main-content">
      <!-- كارت اللاعب 3D والسجل (الرئيسية) -->
      <section id="view-home" class="view-section active"></section>

      <!-- ساحة المباريات والملاعب -->
      <section id="view-arena" class="view-section hidden"></section>

      <!-- بطولات ودورات رمضان -->
      <section id="view-tournaments" class="view-section hidden"></section>

      <!-- السبورة التكتيكية -->
      <section id="view-tactics" class="view-section hidden"></section>

      <!-- فريقي وإدارة التشكيلة -->
      <section id="view-team" class="view-section hidden"></section>

      <!-- سوق الكشافين واللاعبين -->
      <section id="view-scout" class="view-section hidden"></section>

      <!-- غرفة العمليات والطوارئ -->
      <section id="view-operations" class="view-section hidden"></section>

      <!-- الملف الشخصي والجواز الرياضي -->
      <section id="view-profile" class="view-section hidden"></section>

      <!-- صروح وورش الفراعنة ومقابر الملوك -->
      <section id="view-industry" class="view-section hidden"></section>

      <!-- محمية الأنساب والوراثة 89x -->
      <section id="view-sanctuary" class="view-section hidden"></section>

      <!-- بوابة المنظومة المركزية (الهاب) -->
      <section id="view-hub" class="view-section hidden"></section>

      <!-- شاشة الإعداد الأولية -->
      <section id="view-onboarding" class="view-section hidden"></section>
    </main>

    <!-- 4. شريط التنقل السفلي الأصلي (Dynamic Bottom Navbar) -->
    <nav id="global-navbar" class="bottom-navbar"></nav>

    <!-- 5. القائمة الجانبية الأصلية (Side Menu Drawer) -->
    <div id="main-menu-overlay" class="menu-overlay">
      <div class="side-menu-drawer">
        <div class="menu-header">
          <h2>NOUB SPORTS</h2>
          <button id="close-menu-btn" class="icon-btn-ghost"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="menu-list">
          <button class="menu-item" id="menu-card-btn">
            <i class="fa-solid fa-id-card"></i>
            <span>كارتي 3D والجواز الرياضي</span>
          </button>
          <button class="menu-item" id="menu-arena-btn">
            <i class="fa-solid fa-futbol"></i>
            <span>المباريات والملاعب</span>
          </button>
          <button class="menu-item" id="menu-tournament-btn">
            <i class="fa-solid fa-trophy"></i>
            <span>بطولات ودورات رمضان</span>
          </button>
          <button class="menu-item" id="menu-tactics-btn">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>السبورة التكتيكية</span>
          </button>
          <button class="menu-item" id="menu-team-btn">
            <i class="fa-solid fa-shield-halved"></i>
            <span>إدارة فريقي</span>
          </button>
          <button class="menu-item" id="menu-scout-btn">
            <i class="fa-solid fa-binoculars"></i>
            <span>سوق الكشافين</span>
          </button>
          <button class="menu-item" id="menu-operations-btn">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>غرفة طوارئ الملاعب</span>
          </button>
          <hr class="menu-divider">
          <button class="menu-item" id="menu-industry-btn">
            <i class="fa-solid fa-landmark"></i>
            <span>صروح وورش الفراعنة</span>
          </button>
          <button class="menu-item" id="menu-sanctuary-btn">
            <i class="fa-solid fa-paw"></i>
            <span>محمية الأنساب 89x</span>
          </button>
          <button class="menu-item" id="menu-profile-btn">
            <i class="fa-solid fa-vault"></i>
            <span>الخزنة الملكية والعرش</span>
          </button>
          <button class="menu-item" id="menu-hub-btn">
            <i class="fa-solid fa-crown"></i>
            <span>المنظومة المركزية (HUB)</span>
          </button>
          <hr class="menu-divider">
          <button class="menu-item" id="menu-logout-btn" style="color:#ef4444;">
            <i class="fa-solid fa-arrow-right-from-bracket" style="color:#ef4444;"></i>
            <span>تسجيل الخروج</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 6. لوحة الإجراءات السريعة المنبثقة (FAB Actions Sheet) -->
    <div id="fab-actions-overlay" class="modal-overlay hidden">
      <div class="fab-sheet">
        <div class="fab-header">
          <h4>إجراءات سريعة - نوب سبورتس</h4>
          <button class="icon-btn-ghost" id="fab-close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="fab-grid">
          <div class="fab-btn-tile emergency" id="fab-action-emergency">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>نداء طوارئ كروي (نقص لاعبين)</span>
          </div>
          <div class="fab-btn-tile" id="fab-action-match">
            <i class="fa-solid fa-futbol"></i>
            <span>حجز / تسجيل مباراة</span>
          </div>
          <div class="fab-btn-tile" id="fab-action-tournament">
            <i class="fa-solid fa-trophy"></i>
            <span>تنظيم دورة رمضانية</span>
          </div>
          <div class="fab-btn-tile" id="fab-action-tactic">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>السبورة التكتيكية</span>
          </div>
          <div class="fab-btn-tile" id="fab-action-card">
            <i class="fa-solid fa-id-card"></i>
            <span>كارت اللاعب 3D</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 7. حاوية التنبيهات والإشعارات الفورية -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 8. ملف التشغيل الرئيسي الموحد -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
